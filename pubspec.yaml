publish_to: 'none'
version: 1.1.2+30

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  tflite_flutter: ^0.11.0
  image: ^3.0.1
